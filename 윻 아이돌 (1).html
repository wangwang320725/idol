.scr{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.hide{display:none!important}
#menu{align-items:center;justify-content:center;text-align:center;background:#0006}
#menu h1{font-size:clamp(34px,10vw,56px);line-height:1.2;margin-bottom:8px;text-shadow:0 0 24px var(--pk)}
#menu p{opacity:.8;margin-bottom:28px}
.mb{display:block;width:min(260px,80%);margin:6px auto;font:inherit;font-size:18px;color:var(--fg);background:#ffffff14;border:1.5px solid #ffffff55;border-radius:12px;padding:12px;cursor:pointer}
.mb:disabled{opacity:.35}
button:focus-visible{outline:3px solid var(--pk)}
#top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;font-size:13px;display:flex;align-items:center;gap:10px;z-index:5}#top>div{flex:1}#bk{font:inherit;font-size:20px;line-height:1;color:var(--fg);background:#0007;border:1px solid #fff4;border-radius:50%;width:38px;height:38px;cursor:pointer}
#prog{height:3px;background:#fff3;border-radius:2px;margin-top:6px}#prog i{display:block;height:100%;background:var(--pk);width:0;transition:width .4s}
#game.off #hist,#game.off #box,#game.off #ch,#game.off #ctl,#game.off #nm{visibility:hidden}
#ctl{display:flex;gap:6px;margin-bottom:8px;justify-content:flex-end}
#ctl button{font:inherit;font-size:13px;color:var(--fg);background:#0007;border:1px solid #fff4;border-radius:999px;padding:5px 11px}
#ctl button.on{background:var(--pk);color:#2a1030}
#nm{align-self:flex-start;margin:0 0 -10px 12px;position:relative;z-index:2;background:var(--pk);color:#2a1030;border-radius:999px;padding:2px 14px;font-size:15px}
#box{background:#120d28b0;border:1px solid #fff4;border-radius:14px;padding:10px 16px 26px;min-height:128px;font-size:17px;line-height:1.75;word-break:keep-all;cursor:pointer;position:relative}
.cl{padding:6px 0}.cl+.cl{border-top:1px solid #fff2}.cl b{color:var(--pk);margin-right:7px}.cl i{color:#ffd6e4}.ch{color:var(--bl);font-weight:700}
#box small{position:absolute;right:12px;bottom:6px;opacity:.5;font-size:12px}
#hist{max-height:22vh;overflow-y:auto;margin-bottom:8px;padding:6px 14px;background:#0a0618c0;border:1px solid #fff3;border-radius:12px;font-size:16px;line-height:1.65;word-break:keep-all}#hist:empty{display:none}.hl{padding:5px 0;border-bottom:1px solid #fff2}.hl:last-child{border-bottom:0}.hl b{color:var(--pk);margin-right:7px}.hl i{color:#ffd6e4}
#ch{display:flex;flex-direction:column;gap:9px}
#ch button{font:inherit;font-size:16px;color:var(--fg);background:#120d28f0;border:1.5px solid var(--bl);border-radius:12px;padding:13px 14px;text-align:left;cursor:pointer;word-break:keep-all}
#end{background:#0a0618ee;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:auto}
#end svg{width:min(320px,90%);margin-bottom:10px}
#end small{color:var(--pk);letter-spacing:.1em}#end h2{font-size:28px;margin:6px 0 12px}#end p{line-height:1.8;max-width:34ch;margin-bottom:20px;word-break:keep-all}
#modal{background:#0a0618f2;justify-content:flex-start;overflow:auto;padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
#modal p{line-height:1.8;margin-bottom:10px;word-break:keep-all}
.lg{padding:7px 0;border-bottom:1px solid #fff2;font-size:15px;line-height:1.6}.lg b{color:var(--pk)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gal div{background:#ffffff12;border-radius:10px;padding:8px;text-align:center;font-size:13px}.gal svg{width:100%}
#toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:var(--pk);color:#2a1030;padding:6px 16px;border-radius:999px;font-size:14px;z-index:30}
</style></head><body>

['“좋아해요. 동생 말고, 남자로.”',2,0,'conf',[['하오','진짜 오래 기다렸네, 그 말.']]],
['“형은 제 거였으면 좋겠어요. 누구한테도 안 뺏기게.”',0,2,'conf',[['하오','그 말은… 좋아하는 건지 가두고 싶은 건지 헷갈려.']]],
['끝내 말을 삼킨다',0,0,'',[['*','목구멍까지 올라온 말이 가라앉는다.']]]]}
];
const E={
T:['TRUE END','우리만 아는 비밀','창밖으로 새벽빛이 번진다. 하오 형은 내 손을 놓지 않은 채 웃었다. “일단 멤버들한테는 비밀이다? 특히 규빈이.” 무대 위에서는 다정한 동료, 숙소에서는 서로만 아는 연인. 형이 입은 내 후드 소매를 이번엔 내가 먼저 잡았다.',24,1],
G:['GOOD END','조금 더 가까이','하오 형은 대답 대신 내 손을 잡았다. “아직은 이름 붙이기 무서워. 근데 네 옆이 제일 편해.” 우리는 천천히 가기로 했다. 같은 집, 복도 하나 사이로 조금 더 가까워진 거리.',38,0],
N:['NORMAL END','여전히 형과 동생','컴백 활동은 무사히 끝났다. 하오 형은 여전히 내 침대에 앉아 “우리 유진이~” 하고 웃는다. 나도 웃어 보인다. 삼킨 말은 아직 가슴 어딘가에 남아 있다.',65,0],
B:['BAD END','너무 가까웠던 우리','“유진아, 나 잠깐 혼자 있고 싶어.” 하오 형이 처음으로 내 방에 오지 않았다. 문 하나 사이인데 이제는 멀다. 너무 가까웠던 걸까, 내가 너무 조였던 걸까.',108,0]};
const ill=k=>{const g=E[k][3];const p=(x,f)=>`<g fill="${f}"><circle cx="${x}" cy="60" r="18"/><path d="M${x-30} 140q0-48 30-48t30 48z"/></g>`;return `<svg viewBox="0 0 300 150">${p(150-g,'#7fb2ff')}${p(150+g,'#ffb3c7')}${E[k][4]?'<text x="150" y="38" text-anchor="middle" font-size="26" fill="#ff7a9c">♥</text>':''}</svg>`};
const $=i=>document.getElementById(i);let st,auto=0,skip=0,tm,sk;
const sv=()=>{try{localStorage.setItem('zh',JSON.stringify(st))}catch(e){}};
const ld=()=>{try{return JSON.parse(localStorage.getItem('zh'))}catch(e){return null}};
const gl=()=>{try{return JSON.parse(localStorage.getItem('zhg'))||[]}catch(e){return[]}};
const Q=()=>{const s=S[st.si];return s.l.filter(c).concat(st.rc>=0?[['>',s.o[st.rc][0]]].concat(s.o[st.rc][4]):[])};
const toast=t=>{const d=document.createElement('div');d.id='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1400)};
function setBg(){const b=$('bg');b.style.opacity=0;setTimeout(()=>{b.className=S[st.si].b;b.style.opacity=1},300);$('chap').textContent=S[st.si].c;$('prog').firstChild.style.width=(st.si/S.length*100)+'%'}
function start(s){st=s;$('menu').classList.add('hide');$('end').classList.add('hide');$('game').classList.remove('hide');setBg();show()}
function show(){clearTimeout(tm);const s=S[st.si],q=Q();
 if(st.step<q.length){const k=Math.min(3,q.length-st.step),xs=q.slice(st.step,st.step+k);$('ch').classList.add('hide');$('box').classList.remove('hide');$('nm').style.display='none';
  $('box').className='';$('box').innerHTML=xs.map(fmt).join('')+'<small>▼</small>';
  const l=st.log;if(l.slice(-k).map(y=>y[1]).join()!==xs.map(y=>y[1]).join()){xs.forEach(y=>l.push(y));l.length>300&&l.splice(0,l.length-300)}sv();rh(l.slice(-(k+2),-k));
  if(auto)tm=setTimeout(next,1800+900*k);else if(skip)tm=setTimeout(next,90)}
 else if(st.rc<0){skip=0;rh(st.log.slice(-2));$('cs').classList.remove('on');$('box').classList.add('hide');$('nm').style.display='none';const h=$('ch');h.innerHTML='';h.classList.remove('hide');
  s.o.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o[0];b.onclick=()=>{snap();st.a+=o[1];st.j+=o[2];o[3]&&(st.f[o[3]]=1);st.rc=i;st.step=s.l.filter(c).length;show()};h.appendChild(b)});sv()}
 else if(st.si>=S.length-1)finish();
 else{st.si++;st.step=0;st.rc=-1;setBg();show()}}
function rh(a){const h=$('hist');h.innerHTML=a.map(x=>`<div class="hl">${x[0]==='>'?'<span class="ch">▶ '+x[1]+'</span>':x[0]===''?x[1]:x[0]==='*'?'<i>(속마음) '+x[1]+'</i>':'<b>'+x[0]+'</b>'+x[1]}</div>`).join('');h.scrollTop=h.scrollHeight}
function snap(){const{si,step,rc,a,j,f}=st;(st.h=st.h||[]).push(JSON.stringify({si,step,rc,a,j,f,ll:st.log.length}));st.h.length>200&&st.h.shift()}
const fmt=x=>'<div class="cl">'+(x[0]==='>'?'<span class="ch">▶ '+x[1]+'</span>':x[0]===''?x[1]:x[0]==='*'?'<i>(속마음) '+x[1]+'</i>':'<b>'+x[0]+'</b>'+x[1])+'</div>';
function next(){snap();const q=Q();st.step+=Math.min(3,q.length-st.step);show()}
function back(){if(!st.h||!st.h.length){toast('첫 장면이에요');return}auto=skip=0;$('ca').classList.remove('on');$('cs').classList.remove('on');const p=JSON.parse(st.h.pop());if(p.ll!=null)st.log.length=Math.min(st.log.length,p.ll);delete p.ll;Object.assign(st,p);setBg();show()}
function finish(){skip=0;const{a,j,f}=st;const k=j>=14?'B':!f.conf?'N':(a>=22&&j<=8)?'T':a>=13?'G':'N';
 const g=gl();if(!g.includes(k)){g.push(k);try{localStorage.setItem('zhg',JSON.stringify(g))}catch(e){}}
 try{localStorage.removeItem('zh')}catch(e){}
 const e=E[k];$('end').innerHTML=ill(k)+`<small>${e[0]}</small><h2>${e[1]}</h2><p>${e[2]}</p><button class="mb" id="re">처음부터 다시</button><button class="mb" id="rm">메인 화면</button>`;
 $('end').classList.remove('hide');$('bg').className='dawn';$('re').onclick=()=>start({si:0,step:0,rc:-1,a:0,j:0,f:{},log:[]});$('rm').onclick=menu}
function menu(){clearTimeout(tm);auto=skip=0;$('ca').classList.remove('on');$('cs').classList.remove('on');$('game').classList.add('hide');$('end').classList.add('hide');$('menu').classList.remove('hide');$('bg').className='dawn';$('bc').disabled=!ld()}
function modal(h){$('modal').innerHTML=h+'<button class="mb" id="mc">닫기</button>';$('modal').classList.remove('hide');$('mc').onclick=()=>$('modal').classList.add('hide')}
$('bn').onclick=()=>start({si:0,step:0,rc:-1,a:0,j:0,f:{},log:[]});
$('bc').onclick=()=>{const s=ld();s&&start(s)};
$('bs').onclick=()=>modal('<h2>STORY</h2><p>데뷔 3년 차 5인조 아이돌 ZERO HOUR의 막내 한유진. 같은 집에 사는 연상 멤버 장하오를 오래 좋아했지만, 하오에게 유진은 그저 귀여운 동생이다.</p><p>컴백 준비, 음악방송, 콘서트까지. 숨겨 온 질투와 독점욕이 조금씩 새어 나오기 시작한다. 당신의 선택이 두 사람의 결말을 바꾼다.</p>');
$('bg2').onclick=()=>{const g=gl();modal('<h2>GALLERY</h2><div class="gal">'+['T','G','N','B'].map(k=>g.includes(k)?`<div>${ill(k)}${E[k][0]}<br>${E[k][1]}</div>`:'<div style="padding:40px 8px">???<br>미해금</div>').join('')+'</div><br>')};
$('box').onclick=()=>{if(!auto&&!skip)next()};
$('cl').onclick=()=>modal('<h2>대사 로그</h2>'+st.log.map(x=>`<div class="lg"><b>${x[0]==='*'?'유진(속마음)':x[0]==='>'?'내 선택':x[0]}</b> ${x[1]}</div>`).join(''));
$('ca').onclick=()=>{auto=!auto;skip=0;$('ca').classList.toggle('on',auto);$('cs').classList.remove('on');auto?show():clearTimeout(tm)};
$('cs').onclick=()=>{skip=!skip;auto=0;$('cs').classList.toggle('on',skip);$('ca').classList.remove('on');skip?show():clearTimeout(tm)};
$('cv').onclick=()=>{sv();toast('저장했어요')};
$('cm').onclick=()=>{sv();menu()};
$('bk').onclick=back;
$('cu').onclick=e=>{e.stopPropagation();$('game').classList.add('off');toast('화면을 터치하면 돌아와요')};
$('game').addEventListener('click',()=>$('game').classList.remove('off'));
menu();
</script></body></html>
